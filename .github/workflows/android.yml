name: android

# Builds the Android app (an installable APK) and, for an `android-v*` tag, publishes it as a GitHub pre-release.
# The APK is signed with the ALPHA key in android/keystore (public on purpose, for testing only).
# Before a real release: put your own keystore in GitHub secrets and change signingConfigs in android/app/build.gradle.
on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'
    # Pushing the branch `android-dev` builds and checks the APK without publishing a release.
    branches:
      - 'android-dev'

permissions:
  contents: read

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 needs JDK 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The web build needs no Electron binary and no yt-dlp: skip their install scripts.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build the web UI and sync it into the Android project
        run: npm run android:sync

      # Optional: the owner's own signing key. Without the secrets the public alpha key is used (see docs/ANDROID_SIGNING.md).
      - name: Use my own signing key (only when the secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.OLI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/oli-release.jks"
            echo "OLI_KEYSTORE_FILE=$RUNNER_TEMP/oli-release.jks" >> "$GITHUB_ENV"
            echo "Signing with the owner's own key"
          else
            echo "No own key set: signing with the public alpha key"
          fi

      - name: Build the APK
        working-directory: android
        env:
          OLI_KEYSTORE_PASSWORD: ${{ secrets.OLI_KEYSTORE_PASSWORD }}
          OLI_KEY_ALIAS: ${{ secrets.OLI_KEY_ALIAS }}
          OLI_KEY_PASSWORD: ${{ secrets.OLI_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # On failure the compiler / Gradle messages are also published as annotations (public, readable without logging in).
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            grep -E "error:|What went wrong|Execution failed|Caused by|symbol:|location:|cannot find|incompatible" -A2 ../gradle-build.log | head -60 | while IFS= read -r line; do echo "::error::${line}"; done
            exit "$status"
          fi

      # Android's own verifier (from the SDK build-tools on the runner): fails the job if the signature is invalid.
      - name: Verify the APK signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 24 android/app/build/outputs/apk/release/*.apk

      - name: Name the APK and write its checksum
        run: |
          # Android has its own version: the tag (android-v0.1.0) or, for a manual run, versionName in build.gradle.
          VERSION="${GITHUB_REF_NAME#android-v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          fi
          mkdir -p out-apk
          cp android/app/build/outputs/apk/release/*.apk "out-apk/Oli-${VERSION}-android.apk"
          (cd out-apk && sha256sum *.apk | tee SHA256SUMS-android.txt)
          ls -la out-apk

      - name: Upload the APK
        uses: actions/upload-artifact@v6
        with:
          name: oli-android
          path: out-apk/*
          if-no-files-found: error

  release:
    name: Publish Android pre-release
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          name: oli-android
          path: artifacts

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Re-running a tag replaces the release (and its old files); the tag itself stays.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" artifacts/* \
            --prerelease \
            --title "Oli Android ${TAG#android-v} (alpha)" \
            --notes-file .github/android-release-notes.md
