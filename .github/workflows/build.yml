name: build

# Runs on every version tag (v1.2.3) and by hand. A tag builds the Windows installer and the macOS
# disk images, then publishes a GitHub Release with the files and their SHA-256 checksums.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            builder: --win --x64
            artifact: oli-windows-x64
          - name: macOS (Intel + Apple silicon)
            os: macos-latest
            builder: --mac --x64 --arm64
            artifact: oli-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` also runs scripts/fetch-yt-dlp.mjs (postinstall): it downloads the yt-dlp binary for
      # this platform and checks its SHA-256 against the official release before it is packaged.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        if: runner.os == 'Windows'
        run: npm run lint

      - name: Test
        if: runner.os == 'Windows'
        run: npm test

      - name: Build
        run: npm run build

      - name: Package
        run: npx electron-builder ${{ matrix.builder }} --publish never

      - name: Verify the macOS app signature (ad-hoc)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for app in dist/mac*/Oli.app; do
            echo "Checking $app"
            codesign --verify --deep --strict --verbose=2 "$app"
          done

      - name: Show what was built
        shell: bash
        run: ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "Oli ${TAG#v}" \
              --notes-file .github/release-notes.md
          fi

      # One page with every download: the newest Android APK (from the android-v* pre-releases) goes on this page too.
      # Best effort: a problem here never stops the desktop release.
      - name: Attach the newest Android APK
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          AND=$(gh release list --limit 50 --json tagName --jq '[.[] | select(.tagName | test("^android-v[0-9]"))][0].tagName')
          if [ -n "$AND" ]; then bash scripts/attach-android.sh "$TAG" "$AND"; else echo "no Android release yet"; fi
